[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcctvmi"
version = "0.1.0"
description = "Spectral simulation testbed for task detectability and quantitation after denoising of PCD-CT virtual monoenergetic images"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Yamamoto, Shuji", email = "yamamoto@lisit.jp" },
]
dependencies = [
  "numpy",
  "scipy",
  "scikit-image",
  "matplotlib",
  "torch",
]

[project.urls]
Repository = "https://github.com/Institute-of-One/pcct-vmi-core"

[tool.setuptools.packages.find]
include = ["pcctvmi*"]

[tool.setuptools.package-data]
pcctvmi = ["data/*.csv"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["scipy.*", "skimage.*", "matplotlib.*", "xraylib", "spekpy"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["torch.*", "torch"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "error::DeprecationWarning",
  "ignore::DeprecationWarning:skimage",
  "ignore::DeprecationWarning:numpy",
  "ignore::DeprecationWarning:scipy",
  "ignore::DeprecationWarning:matplotlib",
]
